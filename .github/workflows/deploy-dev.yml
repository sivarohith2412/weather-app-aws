name: Deploy development
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      schedule_state:
        description: Enable or pause automatic weather collection
        type: choice
        options: [ENABLED, DISABLED]
        default: ENABLED
permissions:
  contents: read
concurrency:
  group: weather-dev-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: mvn -B package
      - run: npm ci
      - run: mvn -B -f infrastructure/pom.xml verify
      - run: npm run synth
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
      - name: Verify AWS account
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          test "$account" = "471084227270"
      - run: npm run diff
      - name: Deploy development stack
        env:
          SCHEDULE_STATE: ${{ inputs.schedule_state }}
        run: |
          if [ -n "$SCHEDULE_STATE" ]; then
            npm run deploy:dev -- --outputs-file deployment-outputs.json --parameters "WeatherDev:CollectionScheduleState=$SCHEDULE_STATE"
          else
            npm run deploy:dev -- --outputs-file deployment-outputs.json
          fi
      - name: Verify deployed worker is active
        run: |
          aws lambda wait function-active --function-name weather-worker-dev
          aws lambda wait function-updated --function-name weather-worker-dev
          aws lambda get-function-configuration --function-name weather-worker-dev --query '{State:State,Update:LastUpdateStatus,Runtime:Runtime,Handler:Handler}'
